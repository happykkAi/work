[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "work-platform"
version = "0.1.0"
description = "Institution-scoped Work execution boundary for Octop"
requires-python = ">=3.12,<3.13"
dependencies = ["pyjwt>=2.8,<3"]

[dependency-groups]
dev = ["mypy==2.1.0", "pytest==9.1.1", "pyyaml==6.0.3", "ruff==0.15.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/work_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/work_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
