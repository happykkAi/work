# Synthetic-only acceptance template. Each organization has a separate
# PostgreSQL instance, role credentials, data volumes, and internal network.
# No host ports or public egress are enabled.
services:
  postgres-org-a:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      WORK_CONTROL_ROLE: work_control_org_a
      WORK_CONTROL_DB: work_control_org_a
      OCTOP_RUNTIME_ROLE: octop_runtime_org_a
      OCTOP_RUNTIME_DB: octop_runtime_org_a
    secrets:
      - source: org-a-postgres-superuser-password
        target: postgres_superuser_password
      - source: org-a-work-control-password
        target: work_control_password
      - source: org-a-octop-runtime-password
        target: octop_runtime_password
    volumes:
      - org-a-postgres-data:/var/lib/postgresql/data
      - ./init-runtime-databases.sh:/docker-entrypoint-initdb.d/10-runtime-databases.sh:ro
    networks: [org-a-private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  octop-org-a:
    image: ${WORK_RUNTIME_IMAGE:?set a locally built image by digest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - export OCTOP_DATABASE_URL="$(cat /run/secrets/octop_database_url)"; export WORK_CONTROL_DATABASE_URL="$(cat /run/secrets/work_control_database_url)"; exec octop run
    environment:
      OCTOP_HOME: /data/.octop
      WORK_RUNTIME_ID: org-a
      WORK_ORGANIZATION_ID: org-a
      WORK_VOLUME_ID: org-a-data
      WORK_SECRET_REF: org-a-octop-database-url
      WORK_RUNTIME_ENDPOINT: https://octop-org-a:8088
      WORK_HANDOFF_SECRET_REF: org-a-handoff
      WORK_RUNTIME_SECRETS_DIR: /run/secrets
      WORK_RUNTIME_MTLS_CA_FILE: /run/secrets/work-runtime-ca
      WORK_RUNTIME_MTLS_CERT_FILE: /run/secrets/org-a-server-cert
      WORK_RUNTIME_MTLS_KEY_FILE: /run/secrets/org-a-server-key
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["org-a-data:/data/.octop"]
    networks: [org-a-private]
    secrets:
      - source: org-a-octop-database-url
        target: octop_database_url
      - source: org-a-work-control-database-url
        target: work_control_database_url
      - source: org-a-handoff
        target: org-a-handoff
      - source: work-runtime-ca
        target: work-runtime-ca
      - source: org-a-server-cert
        target: org-a-server-cert
      - source: org-a-server-key
        target: org-a-server-key
    depends_on:
      postgres-org-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; socket.create_connection(('127.0.0.1', int(os.getenv('OCTOP_PORT', '8088'))), 2).close()"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: "no"

  postgres-org-b:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      WORK_CONTROL_ROLE: work_control_org_b
      WORK_CONTROL_DB: work_control_org_b
      OCTOP_RUNTIME_ROLE: octop_runtime_org_b
      OCTOP_RUNTIME_DB: octop_runtime_org_b
    secrets:
      - source: org-b-postgres-superuser-password
        target: postgres_superuser_password
      - source: org-b-work-control-password
        target: work_control_password
      - source: org-b-octop-runtime-password
        target: octop_runtime_password
    volumes:
      - org-b-postgres-data:/var/lib/postgresql/data
      - ./init-runtime-databases.sh:/docker-entrypoint-initdb.d/10-runtime-databases.sh:ro
    networks: [org-b-private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  octop-org-b:
    image: ${WORK_RUNTIME_IMAGE:?set a locally built image by digest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - export OCTOP_DATABASE_URL="$(cat /run/secrets/octop_database_url)"; export WORK_CONTROL_DATABASE_URL="$(cat /run/secrets/work_control_database_url)"; exec octop run
    environment:
      OCTOP_HOME: /data/.octop
      WORK_RUNTIME_ID: org-b
      WORK_ORGANIZATION_ID: org-b
      WORK_VOLUME_ID: org-b-data
      WORK_SECRET_REF: org-b-octop-database-url
      WORK_RUNTIME_ENDPOINT: https://octop-org-b:8088
      WORK_HANDOFF_SECRET_REF: org-b-handoff
      WORK_RUNTIME_SECRETS_DIR: /run/secrets
      WORK_RUNTIME_MTLS_CA_FILE: /run/secrets/work-runtime-ca
      WORK_RUNTIME_MTLS_CERT_FILE: /run/secrets/org-b-server-cert
      WORK_RUNTIME_MTLS_KEY_FILE: /run/secrets/org-b-server-key
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["org-b-data:/data/.octop"]
    networks: [org-b-private]
    secrets:
      - source: org-b-octop-database-url
        target: octop_database_url
      - source: org-b-work-control-database-url
        target: work_control_database_url
      - source: org-b-handoff
        target: org-b-handoff
      - source: work-runtime-ca
        target: work-runtime-ca
      - source: org-b-server-cert
        target: org-b-server-cert
      - source: org-b-server-key
        target: org-b-server-key
    depends_on:
      postgres-org-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; socket.create_connection(('127.0.0.1', int(os.getenv('OCTOP_PORT', '8088'))), 2).close()"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: "no"

networks:
  org-a-private:
    internal: true
  org-b-private:
    internal: true

volumes:
  org-a-data:
  org-b-data:
  org-a-postgres-data:
  org-b-postgres-data:

secrets:
  org-a-postgres-superuser-password:
    file: ${WORK_ORG_A_POSTGRES_SUPERUSER_PASSWORD_FILE:?point to a synthetic org-a database superuser password file}
  org-a-work-control-password:
    file: ${WORK_ORG_A_WORK_CONTROL_PASSWORD_FILE:?point to the org-a Work database role password file}
  org-a-octop-runtime-password:
    file: ${WORK_ORG_A_OCTOP_RUNTIME_PASSWORD_FILE:?point to the org-a Octop database role password file}
  org-a-octop-database-url:
    file: ${WORK_ORG_A_OCTOP_DATABASE_URL_FILE:?point to the org-a Octop database URL file}
  org-a-work-control-database-url:
    file: ${WORK_ORG_A_WORK_CONTROL_DATABASE_URL_FILE:?point to the org-a Work database URL file}
  org-b-postgres-superuser-password:
    file: ${WORK_ORG_B_POSTGRES_SUPERUSER_PASSWORD_FILE:?point to a synthetic org-b database superuser password file}
  org-b-work-control-password:
    file: ${WORK_ORG_B_WORK_CONTROL_PASSWORD_FILE:?point to the org-b Work database role password file}
  org-b-octop-runtime-password:
    file: ${WORK_ORG_B_OCTOP_RUNTIME_PASSWORD_FILE:?point to the org-b Octop database role password file}
  org-b-octop-database-url:
    file: ${WORK_ORG_B_OCTOP_DATABASE_URL_FILE:?point to the org-b Octop database URL file}
  org-b-work-control-database-url:
    file: ${WORK_ORG_B_WORK_CONTROL_DATABASE_URL_FILE:?point to the org-b Work database URL file}
  org-a-handoff:
    file: ${WORK_ORG_A_HANDOFF_SECRET_FILE:?point to a 32-byte org-a handoff secret file}
  org-b-handoff:
    file: ${WORK_ORG_B_HANDOFF_SECRET_FILE:?point to a 32-byte org-b handoff secret file}
  work-runtime-ca:
    file: ${WORK_RUNTIME_MTLS_CA_FILE:?point to the Work runtime CA certificate}
  org-a-server-cert:
    file: ${WORK_ORG_A_MTLS_CERT_FILE:?point to the org-a server certificate}
  org-a-server-key:
    file: ${WORK_ORG_A_MTLS_KEY_FILE:?point to the org-a server private key}
  org-b-server-cert:
    file: ${WORK_ORG_B_MTLS_CERT_FILE:?point to the org-b server certificate}
  org-b-server-key:
    file: ${WORK_ORG_B_MTLS_KEY_FILE:?point to the org-b server private key}
