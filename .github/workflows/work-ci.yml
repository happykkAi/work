name: Work candidate checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: 0.12.19
          python-version: 3.12.13
          enable-cache: true

      - name: Verify and install both locked Python projects
        run: |
          uv lock --check
          uv lock --project packages/work_platform --check
          uv sync --frozen --python 3.12.13
          uv sync --project packages/work_platform --frozen --python 3.12.13

      - name: Install locked dashboard dependencies before full-stack gates
        run: npm ci --prefix dashboard --no-audit

      - name: Run backend and Work contracts
        run: make check-all

      - name: Run isolated Work platform contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --project packages/work_platform --locked --python 3.12.13 \
            pytest --confcutdir=tests/work_contracts \
            -c packages/work_platform/pyproject.toml \
            -q tests/work_contracts

      - name: Run dashboard tests
        run: |
          cd dashboard
          npm test -- --run --maxWorkers=2

      - name: Build Octop and Work distributions
        run: |
          make build
          uv build --project packages/work_platform --wheel --out-dir dist/work-platform
          WORK_PLATFORM_WHEEL="$(find dist/work-platform -maxdepth 1 -name 'work_platform-*.whl' -print -quit)" \
            PYTHONPATH="$GITHUB_WORKSPACE" python3 tests/work_contracts/test_distribution.py
          OCTOP_SHA=$(python3 -c 'import json; print(json.load(open("deploy/work/source-manifest.example.json"))["source_repositories"]["octop_upstream"]["commit_sha"])')
          WORK_WHEEL=$(find dist/work-platform -maxdepth 1 -name 'work_platform-*.whl' -print -quit)
          python3 tools/work/verify_distribution.py "$WORK_WHEEL" --work-sha "$GITHUB_SHA" --octop-sha "$OCTOP_SHA" --output dist/work-platform/build-manifest.json

      - name: Build and verify target-platform release image without publishing
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f docker/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/happykkAi/work \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t work2-candidate:"$GITHUB_SHA" .
          docker run --rm --network none --entrypoint python work2-candidate:"$GITHUB_SHA" \
            -c 'import octop, work_platform; from octop.infra.server import OctopServer; from octop.launch import run_foreground_blocking; print("startup-import-ok")'
          docker run --rm --network none --entrypoint uv work2-candidate:"$GITHUB_SHA" \
            pip check --python /app/.venv/bin/python
          docker image inspect work2-candidate:"$GITHUB_SHA" \
            --format '{{json .Id}} {{json .Architecture}} {{json .Config.Labels}}' \
            > dist/work-platform/image-identity.txt
          docker save work2-candidate:"$GITHUB_SHA" | gzip > dist/work-platform/runtime-linux-amd64.tar.gz
          sha256sum dist/*.whl dist/*.tar.gz dist/work-platform/*.whl \
            dist/work-platform/*.json dist/work-platform/image-identity.txt \
            dist/work-platform/runtime-linux-amd64.tar.gz > dist/work-platform/artifacts.sha256

      - name: Preserve checked release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work2-candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/work-platform/
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: PostgreSQL authority and multi-process gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: work2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d work2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OCTOP_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/work2_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: 0.12.19
          python-version: 3.12.13
          enable-cache: true
      - run: uv sync --frozen --python 3.12.13
      - name: Run real database gates serially on the disposable CI database
        run: |
          uv run pytest -q -m postgresql \
            tests/integration/test_postgresql_control_plane.py \
            tests/integration/test_postgresql_checkpoint_history.py \
            tests/integration/test_work_runtime_permissions.py \
            tests/integration/test_work_legacy_import.py
